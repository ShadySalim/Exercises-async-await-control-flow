<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript Tutorial</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        text-align: center;
      }
      h1 {
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-slate-50 flex flex-col items-center pt-16 px-4">
      <h1 class="text-4xl font-semibold tracking-wide text-slate-900">AJAX</h1>
      <button
        type="button"
        class="mt-6 inline-flex items-center px-6 py-3 bg-indigo-600 text-white text-lg font-medium rounded-lg shadow-md hover:bg-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition"
        id="btn"
      >
        Explore Requests
      </button>
      <div
        id="loading"
        class="mt-8 w-full max-w-3xl flex items-center justify-center gap-3 rounded-xl border border-indigo-100 bg-white px-5 py-4 text-indigo-700 shadow hidden"
        aria-live="polite"
      >
        <span class="inline-flex h-4 w-4 animate-spin rounded-full border-2 border-indigo-500 border-t-transparent"></span>
        <span class="text-sm font-medium tracking-wide">Loading response…</span>
      </div>
      <p class="mt-8 w-full max-w-3xl text-left text-lg leading-relaxed text-slate-700 bg-white border border-slate-200 rounded-xl shadow p-5 hidden" id="text">
       
      </p>
      <div
        id="error"
        role="alert"
        class="mt-6 w-full max-w-3xl flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 px-5 py-4 text-left text-red-800 shadow hidden"
      >
        <span class="mt-1 inline-flex h-3 w-3 flex-shrink-0 rounded-full bg-red-500"></span>
        <div>
          <h2 class="text-lg font-semibold">Request failed</h2>
          <p class="mt-1 text-sm leading-relaxed">
            Something went wrong while contacting the server. Please try again in a moment.
          </p>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
